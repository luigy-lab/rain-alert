name: Test Birthday Email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required files
        run: |
          test -f main.py || { echo "main.py not found"; exit 1; }
          test -f requirements.txt || { echo "requirements.txt not found"; exit 1; }
          test -f birthdays.csv || { echo "birthdays.csv not found"; exit 1; }

          compgen -G "letter_templates/letter_*.txt" > /dev/null || {
            echo "No letter templates found"
            exit 1
          }

          echo "All required files were found"

      - name: Check secrets
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
        run: |
          test -n "$MY_EMAIL" || { echo "MY_EMAIL is not configured"; exit 1; }
          test -n "$MY_PASSWORD" || { echo "MY_PASSWORD is not configured"; exit 1; }

          echo "Both secrets are configured"

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Send test email
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
          TEST_MODE: "true"
        run: python rain_main.py
