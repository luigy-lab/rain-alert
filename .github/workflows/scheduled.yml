name: Daily Rain Alert

on:
  schedule:
    - cron: "0 19 * * *"
      timezone: "Europe/Lisbon"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      ACCOUNT_SID: ${{ secrets.ACCOUNT_SID }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
      API_KEY: ${{ secrets.API_KEY }}
      MY_PHONE: ${{ secrets.MY_PHONE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show trigger information
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "UTC time:"
          date -u
          echo "Lisbon time:"
          TZ=Europe/Lisbon date

      - name: Check secrets
        run: |
          test -n "$ACCOUNT_SID" || {
            echo "ACCOUNT_SID is not configured"
            exit 1
          }

          test -n "$AUTH_TOKEN" || {
            echo "AUTH_TOKEN is not configured"
            exit 1
          }

          test -n "$API_KEY" || {
            echo "API_KEY is not configured"
            exit 1
          }

          test -n "$MY_PHONE" || {
            echo "MY_PHONE is not configured"
            exit 1
          }

          echo "All required secrets are configured"

      - name: Run rain alert
        run: python rain_main.py
